apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautible-app-ms-payment
  namespace: nautible-app-ms
spec:
  template:
    spec:
      containers:
      - name: nautible-app-ms-payment
        image: nautibledevacr.azurecr.io/nautible-app-ms-payment:05700e3673227bb388dcab5eea4d0039b914fdfc
        env:
        - name: LOG_LEVEL # DEBUG, INFO, WARN, ERROR, DPANIC, PANIC, FATAL
          value: INFO
        - name: LOG_FORMAT # json, console
          value: json
        - name: DYNAMODB_REGION
          value: ap-northeast-1
